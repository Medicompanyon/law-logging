services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: law_logging
      POSTGRES_USER: law_logging
      POSTGRES_PASSWORD: local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U law_logging -d law_logging"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - law_logging_postgres:/var/lib/postgresql/data

volumes:
  law_logging_postgres:
